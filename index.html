<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>[YOUR NAME] | Freelance Editor, Proofreader &amp; Content Specialist</title>
    <meta
      name="description"
      content="[YOUR NAME] is a freelance editor, proofreader, and content specialist offering editing, proofreading, formatting, and content-improvement services on Fiverr. View a portfolio and get in touch."
    />
    <meta name="author" content="[YOUR NAME]" />
    <link rel="canonical" href="[YOUR CANONICAL URL, e.g. https://yourdomain.io/]" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="[YOUR NAME] | Freelance Editor, Proofreader & Content Specialist" />
    <meta
      property="og:description"
      content="Editing, proofreading, formatting, and content-improvement services for individuals, creators, students, professionals, and businesses."
    />
    <meta property="og:url" content="[YOUR CANONICAL URL]" />
    <meta property="og:image" content="[YOUR SOCIAL PREVIEW IMAGE URL — e.g. https://yourdomain.io/og-image.png]" />
    <meta property="og:site_name" content="[YOUR NAME]" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="[YOUR NAME] | Freelance Editor, Proofreader & Content Specialist" />
    <meta
      name="twitter:description"
      content="Editing, proofreading, formatting, and content-improvement services for individuals, creators, students, professionals, and businesses."
    />
    <meta name="twitter:image" content="[YOUR SOCIAL PREVIEW IMAGE URL]" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: Newsreader (display serif), Inter (body sans), IBM Plex Mono (utility mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-paper text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
